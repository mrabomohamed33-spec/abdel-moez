:root{
  --gold:#c9a227;
  --gold2:#f5d76e;
  --gold3:#8a6d1a;
  --ink:#17130a;
  --surface:#fffdf6;
  --card:#ffffff;
  --muted:#6b6250;
  --line:#eadfc0;
  --red:#c0392b;
  --green:#1e7a4a;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#17130c;
    --card:#241e12;
    --ink:#fff8dd;
    --muted:#cbbd96;
    --line:#4a3f22;
  }
}

*{
  box-sizing:border-box
}

html{
  scroll-behavior:smooth
}

body{
  margin:0;
  background:var(--surface);
  color:var(--ink);
  font-family:'Cairo',system-ui,sans-serif;
  overflow-x:clip
}

.en{
  font-family:'Playfair Display',Georgia,serif;
  direction:ltr;
  text-align:left
}

.ltr{
  direction:ltr;
  text-align:left;
  unicode-bidi:isolate;
}

.gold-text{
  background:linear-gradient(100deg,#8a6d1a 0%,#c9a227 22%,#fff3a6 45%,#e8c33a 60%,#9a7a14 82%,#f5d76e 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.6))
}

.watermark{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
  opacity:.055;
  transform:rotate(-18deg) scale(1.4);
  display:flex;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:38px 70px;
  padding:20px
}

.watermark span{
  white-space:nowrap;
  font-weight:900;
  font-size:34px;
  color:var(--ink)
}

@keyframes marquee{
  from{
    transform:translateX(0)
  }

  to{
    transform:translateX(50%)
  }
}

.marquee-track{
  display:flex;
  gap:0;
  width:-moz-max-content;
  width:max-content;
  animation:marquee 38s linear infinite;
  direction:ltr
}

.marquee-track:hover{
  animation-play-state:paused
}

@keyframes pulseGold{
  0%,100%{
    box-shadow:0 10px 30px rgba(201,162,39,.28)
  }

  50%{
    box-shadow:0 14px 42px rgba(201,162,39,.5)
  }
}

.gold-btn{
  animation:pulseGold 3s ease-in-out infinite
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 10px 28px rgba(60,45,5,.08)
}

.input{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:12px;
  padding:11px 13px;
  background:var(--card);
  color:var(--ink);
  outline:none
}

.input:focus{
  border-color:var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,39,.18)
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  padding:3px 10px;
  font-size:12px;
  font-weight:800;
  background:#fff3c4;
  color:#6a5510;
  border:1px solid #ead27a
}

@keyframes fadeUp{
  from{
    opacity:0;
    transform:translateY(10px)
  }

  to{
    opacity:1;
    transform:translateY(0)
  }
}

.fade-up{
  animation:fadeUp .35s ease both
}

.q-font{
  font-size:14px;
  line-height:1.7
}

::-webkit-scrollbar{
  height:8px;
  width:8px
}

::-webkit-scrollbar-thumb{
  background:#d9c77d;
  border-radius:99px
}

.home-hero{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  min-height:calc(100vh - var(--safe-area-inset-top) - 64px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(34px,7vw,58px);
  padding:clamp(48px,10vw,84px) 16px;
  text-align:center
}

.home-glow{
  position:absolute;
  border-radius:50%;
  filter:blur(58px);
  pointer-events:none;
  z-index:0
}

.home-glow-1{
  width:340px;
  height:340px;
  top:-70px;
  right:-40px;
  background:radial-gradient(circle,#ffd977 0%,rgba(255,217,119,0) 70%);
  opacity:.75;
  animation:homeFloat 7s ease-in-out infinite
}

.home-glow-2{
  width:420px;
  height:420px;
  bottom:-110px;
  left:-90px;
  background:radial-gradient(circle,#7c4dff 0%,rgba(124,77,255,0) 70%);
  opacity:.7;
  animation:homeFloat 9s ease-in-out infinite reverse
}

.home-glow-3{
  width:240px;
  height:240px;
  top:44%;
  left:58%;
  background:radial-gradient(circle,#ff9d5c 0%,rgba(255,157,92,0) 70%);
  opacity:.45;
  animation:homeFloat 6s ease-in-out infinite
}

@keyframes homeFloat{
  0%,100%{
    transform:translate(0,0) scale(1)
  }

  50%{
    transform:translate(18px,-22px) scale(1.14)
  }
}

.home-name{
  position:relative;
  z-index:1;
  margin:0;
  font-size:clamp(54px,13vw,118px);
  line-height:.98;
  letter-spacing:-.02em;
  text-align:center;
  background:linear-gradient(100deg,#8a5a00 0%,#c9a227 18%,#fff3a6 35%,#fffbe0 48%,#f5d76e 60%,#c9a227 78%,#fff3a6 100%);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 8px 30px rgba(245,215,110,.55)) drop-shadow(0 2px 0 rgba(255,255,255,.25));
  animation:homeShine 4.5s linear infinite
}

@keyframes homeShine{
  to{
    background-position:200% center
  }
}

.home-actions{
  position:relative;
  z-index:1;
  display:flex;
  flex-direction:row;
  gap:16px;
  flex-wrap:nowrap;
  justify-content:center;
  align-items:center;
  width:100%;
  max-width:476px;
  margin-inline:auto
}

.home-btn{
  flex:1 1 215px;
  width:215px;
  max-width:230px;
  min-width:0;
  padding:16px 28px;
  border-radius:999px;
  font-family:inherit;
  font-size:20px;
  font-weight:900;
  cursor:pointer;
  white-space:nowrap;
  transition:transform .18s ease,box-shadow .18s ease
}

@media (max-width:480px){
  .home-btn{
    padding:14px 16px;
    font-size:18px
  }
}

.home-btn:hover{
  transform:translateY(-3px)
}

.home-btn-student{
  border:none;
  background:linear-gradient(100deg,#fff3a6,#f5d76e 45%,#c9a227);
  color:#241a00;
  box-shadow:0 16px 38px rgba(245,215,110,.45),inset 0 1px 0 rgba(255,255,255,.9)
}

.home-btn-teacher{
  border:2px solid rgba(245,215,110,.9);
  background:rgba(255,255,255,.12);
  color:#fff;
  backdrop-filter:blur(6px);
  box-shadow:0 14px 32px rgba(0,0,0,.28)
}

/* Teacher section only: compact buttons + numbered workflow */

.teacher-section button{
  padding:7px 10px !important;
  font-size:13px !important;
  line-height:1.35 !important;
  border-radius:10px !important;
  min-height:0 !important
}

.teacher-flow{
  display:grid;
  gap:6px
}

@media (min-width:640px){
  .teacher-flow{
    grid-template-columns:1fr 1fr;
    grid-auto-flow:column;
    grid-template-rows:repeat(5,auto)
  }
}

.teacher-section .teacher-step-btn{
  display:flex !important;
  align-items:center !important;
  gap:8px !important;
  width:100% !important;
  padding:8px 10px !important;
  text-align:start !important;
  border-radius:12px !important;
  cursor:pointer
}

.teacher-step-num{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:24px;
  height:24px;
  min-width:24px;
  border-radius:50%;
  background:linear-gradient(135deg,#fff3a6,#c9a227);
  color:#241a00;
  font-size:12px;
  font-weight:900;
  box-shadow:0 2px 6px rgba(201,162,39,.35)
}

.teacher-step-desc{
  display:block;
  font-size:11px;
  font-weight:700;
  color:var(--muted)
}

.teacher-step-arrow{
  margin-inline-start:auto;
  color:var(--gold3);
  font-size:13px;
  font-weight:900
}
</style>
